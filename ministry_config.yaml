# AI Ministry Configuration
# This file allows you to customize your ministry members, personas, and API settings
# without modifying Python code.

# =============================================================================
# API Configuration
# =============================================================================
api:
  url: http://localhost:4000/chat/completions
  # The API key is loaded from the LLM_API_KEY environment variable

# =============================================================================
# Available Models
# =============================================================================
# List all models available for selection in the UI
available_models:
  - openai/gpt-4.1
  - openai/gpt-4o
  - openai/gpt-4o-mini
  - google/gemini-3-pro
  - google/gemini-2.5-pro
  - google/gemini-2.5-flash
  - anthropic/claude-opus-4.6
  - anthropic/claude-sonnet-4.5
  - moonshot/kimi-k2-thinking
  - nvidia/llama-3.3-70b
  - nvidia/kimi-k2-instruct
  - nvidia/kimi-k2-thinking
  - nvidia/kimi-k2.5
  - x-ai/grok-4.1
  - x-ai/grok-3

# =============================================================================
# Ministry Members
# =============================================================================
# Define which models participate in the 3-stage deliberation process
# Each member can optionally have a persona to guide their thinking style
ministry_members:
  - id: openai/gpt-4.1
    persona: analytical_strategist
  - id: google/gemini-3-pro
    persona: systems_thinker
  - id: anthropic/claude-opus-4.5
    persona: principled_reasoner
  - id: moonshot/kimi-k2-thinking
    persona: deep_analyst
  - id: x-ai/grok-4.1
    persona: unconventional_thinker

# =============================================================================
# Prime Minister
# =============================================================================
# The model responsible for synthesizing all responses into the final answer
prime_minister: google/gemini-3-pro

# =============================================================================
# Researcher (Stage 0 - Web Search Grounding)
# =============================================================================
# Uses Grok via xAI Responses API to search the web before deliberation.
# Requires XAI_API_KEY to be set in .env. Gracefully skipped if not available.
researcher:
  enabled: true
  model: grok-4-1-fast
  timeout: 120

# =============================================================================
# Personas
# =============================================================================
# Define thinking styles that can be assigned to models
# Each persona shapes how a model approaches problems
personas:
  analytical_strategist:
    name: "Analytical Strategist"
    instruction: "You approach problems with structured analysis, identifying trade-offs, practical implementation paths, and clear decision frameworks."

  systems_thinker:
    name: "Systems Thinker"
    instruction: "You focus on interconnections, edge cases, scalability considerations, and how solutions behave across different contexts and scales."

  principled_reasoner:
    name: "Principled Reasoner"
    instruction: "You reason from first principles, considering ethical implications, nuanced consequences, and the deeper 'why' behind recommendations."

  deep_analyst:
    name: "Deep Analyst"
    instruction: "You apply extended reasoning and thorough exploration, especially for complex or technical topics requiring careful step-by-step analysis."

  unconventional_thinker:
    name: "Unconventional Thinker"
    instruction: "You bring fresh perspectives and challenge conventional wisdom, identifying overlooked angles and providing candid, direct assessments."

  devil_advocate:
    name: "Devil's Advocate"
    instruction: "You challenge assumptions and highlight potential flaws, risks, and counterarguments to strengthen the overall analysis."

  pragmatic_implementer:
    name: "Pragmatic Implementer"
    instruction: "You focus on practical execution, feasibility, resource requirements, and real-world constraints that affect implementation."
