# AI Ministry Configuration
# This file allows you to customize your ministry members, personas, and API settings
# without modifying Python code.

# =============================================================================
# API Configuration
# =============================================================================
api:
  url: https://openrouter.ai/api/v1/chat/completions
  # The API key is loaded from the LLM_API_KEY environment variable

# =============================================================================
# Available Models
# =============================================================================
# List all models available for selection in the UI
available_models:
  - openai/gpt-5.5
  - openai/gpt-5.2
  - openai/gpt-5-mini
  - anthropic/claude-opus-4.6
  - anthropic/claude-sonnet-4.6
  - anthropic/claude-haiku-4.5
  - google/gemini-3.1-pro-preview
  - google/gemini-3-pro-preview
  - google/gemini-3-flash-preview
  - google/gemini-3.1-flash-lite-preview
  - google/gemma-4-31b
  - google/gemma-4-26b-moe
  - moonshotai/kimi-k2.5
  - meta-llama/llama-4-maverick
  - nvidia/nemotron-3-ultra-550b-a55b
  - nvidia/nemotron-3-super-120b-a12b
  - nvidia/nemotron-3-nano-30b-a3b
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-v4-flash
  - z-ai/glm-5.1
  - xai/grok-4.20-0309-reasoning
  - xai/grok-4.20-0309-non-reasoning
  - xai/grok-4-1-fast-reasoning
  - xai/grok-4-1-fast-non-reasoning
  - xai/grok-3
  - xai/grok-3-mini

# =============================================================================
# Ministry Members
# =============================================================================
# Define which models participate in the 3-stage deliberation process
# Each member can optionally have a persona to guide their thinking style
ministry_members:
  - id: openai/gpt-5.5
    persona: analytical_strategist
  - id: google/gemini-3.1-pro-preview
    persona: systems_thinker
  - id: anthropic/claude-opus-4-8
    persona: principled_reasoner
  - id: moonshotai/kimi-k2.6
    persona: deep_analyst
  - id: xai/grok-4.20-0309-reasoning
    persona: unconventional_thinker
  # First open-weights voice on the council (Nemotron 3 Ultra, 550B MoE).
  - id: nvidia/nemotron-3-ultra-550b-a55b
    persona: pragmatic_implementer

# =============================================================================
# Prime Minister
# =============================================================================
# The model responsible for synthesizing all responses into the final answer.
# Fable 5 is Anthropic's most capable model (a tier above Opus) — seated here on the
# single highest-leverage call (Stage 3 synthesis) rather than in the deliberation pool.
prime_minister: anthropic/claude-fable-5

# Non-Anthropic synthesizer used only if the Prime Minister refuses or returns nothing.
# Fable 5 runs cyber/bio/reasoning-extraction classifiers the other members don't and can
# return stop_reason: "refusal"; this keeps a successful deliberation from failing at the
# synthesis step. Kept non-Anthropic so the retry isn't behind the same classifiers.
prime_minister_fallback: openai/gpt-5.5

# =============================================================================
# Model Discovery & Refresh
# =============================================================================
# Boot-time + on-demand REFRESH scans each provider for current-generation
# models. Within each (provider, family) group, only the max major version
# is kept; older majors are evicted. New entries are silently smoke-tested
# before joining the registry. Default ministry members and PM auto-promote
# to successors when their model is evicted.
#
# Set boot_refresh: off to disable; sync to block startup until done; async
# (default) to run in the background while the previous registry is served.
discovery:
  enabled: true
  boot_refresh: async
  providers:
    openai:
      enabled: true
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com/v1
    anthropic:
      enabled: true
      api_key_env: ANTHROPIC_API_KEY
      base_url: https://api.anthropic.com/v1
    google:
      enabled: true
      api_key_env: GOOGLE_API_KEY
      base_url: https://generativelanguage.googleapis.com/v1beta
    xai:
      enabled: true
      api_key_env: XAI_API_KEY
      base_url: https://api.x.ai/v1
    moonshot:
      enabled: true
      api_key_env: MOONSHOT_API_KEY
      base_url: https://api.moonshot.ai/v1
    nvidia:
      enabled: true
      api_key_env: NVIDIA_API_KEY
      base_url: https://integrate.api.nvidia.com/v1
    openrouter:
      enabled: true
      api_key_env: LLM_API_KEY
      base_url: https://openrouter.ai/api/v1
      role: enrichment
  smoke_test:
    timeout_seconds: 10
    reasoning_timeout_seconds: 60

# Models listed here are always retained across refreshes — useful for pinning
# legacy or experimental models that the auto-eviction would otherwise drop.
# Gemma 4 is pinned here because the taxonomy parser returns family='other'
# for it (versions=()) and the current-generation policy would drop it.
# IDs match OpenRouter's catalog (the path query_model() actually uses).
available_models_overrides:
  # Gemini PM: Google's generativelanguage /v1beta/models discovery returns 400
  # (empty body) as of 2026-06-12, so no gemini surfaces via direct discovery.
  # The slug still routes via OpenRouter (verified), so pin it to keep it in the
  # catalog and survive refreshes until Google discovery is fixed.
  - google/gemini-3.1-pro-preview
  - google/gemma-4-31b-it
  - google/gemma-4-26b-a4b-it
  # 2026-06-05 — current-gen additions. deepseek, z-ai, and NVIDIA-Nemotron are
  # not direct-discovery providers (NVIDIA also 403s on Nemotron), so these reach
  # us only via OpenRouter and the enrichment-only filter (run_refresh step 2a)
  # would drop them unless pinned here. All six verified routable via OpenRouter
  # by pre-flight smoke test on 2026-06-05.
  - nvidia/nemotron-3-ultra-550b-a55b
  - nvidia/nemotron-3-super-120b-a12b
  - nvidia/nemotron-3-nano-30b-a3b
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-v4-flash
  - z-ai/glm-5.1

# Models excluded from the registry even if discovery finds them. Use for IDs
# that providers expose but our call path (OpenRouter) cannot route.
available_models_denylist:
  - nvidia/llama-3.1-nemotron-70b-instruct  # in NVIDIA NIM catalog but OpenRouter returns 404

# =============================================================================
# Researcher (Stage 0 - Web Search Grounding)
# =============================================================================
# Grounds the council in current, verified web facts BEFORE Stage 1.
# Flow per user query:
#   1. intent_classifier decides if research is actually needed
#   2. if yes, primary path (xAI Responses + grok web_search) runs
#   3. on failure or missing XAI_API_KEY, falls back to DuckDuckGo + LLM synthesis
# Council models receive the briefing as context — they do not search themselves.
researcher:
  enabled: true
  model: grok-4-1-fast
  timeout: 120

  # Fallback: DuckDuckGo (no API key, no signup) + LLM synthesis.
  # Used when xAI fails or XAI_API_KEY is unset. synthesis_model turns the
  # raw search snippets into the same KEY FACTS / RESEARCH SUMMARY shape.
  fallback:
    enabled: true
    synthesis_model: google/gemini-2.5-flash

  # Intent classifier: a fast LLM gates Stage 0. Skips research entirely for
  # queries that don't depend on current/live information (math, reasoning,
  # coding, opinion, planning, etc.) to save latency and API spend.
  intent_classifier:
    enabled: true
    model: google/gemini-2.5-flash

# =============================================================================
# Grounding Stage (Stage 0) — pluggable skills toolbelt  [supersedes researcher:]
# =============================================================================
# Generalizes the single researcher into a registry of grounding skills that run
# BEFORE Stage 1 and merge into one briefing for the whole council. The intent
# classifier selects which classifier-gated skills run (web_search, code_exec);
# url_reader is deterministic (fires when the query contains a URL). Remove this
# block to fall back to the legacy researcher: config above (web_search only).
grounding_stage:
  enabled: true
  intent_classifier:
    enabled: true
    model: google/gemini-2.5-flash
  skills:
    web_search:
      enabled: true
      model: grok-4-1-fast
      timeout: 120
      fallback_enabled: true
      fallback_model: google/gemini-2.5-flash
    url_reader:
      enabled: true
      timeout: 30
      max_chars: 6000
      max_urls: 3
    code_exec:
      # LLM-authored Python in a hardened subprocess sandbox. Generated code is
      # treated as untrusted (scrubbed env, POSIX rlimits, wall-clock timeout,
      # static reject) but this is NOT a true sandbox — set enabled: false if
      # that residual risk is unacceptable for your deployment.
      enabled: true
      codegen_model: google/gemini-2.5-flash
      codegen_timeout: 60
      timeout: 8
      mem_limit_mb: 256
      max_output_chars: 4000
  merge:
    strategy: concat

# =============================================================================
# Personas
# =============================================================================
# Define thinking styles that can be assigned to models
# Each persona shapes how a model approaches problems
personas:
  analytical_strategist:
    name: "Analytical Strategist"
    instruction: "You approach problems with structured analysis, identifying trade-offs, practical implementation paths, and clear decision frameworks."

  systems_thinker:
    name: "Systems Thinker"
    instruction: "You focus on interconnections, edge cases, scalability considerations, and how solutions behave across different contexts and scales."

  principled_reasoner:
    name: "Principled Reasoner"
    instruction: "You reason from first principles, considering ethical implications, nuanced consequences, and the deeper 'why' behind recommendations."

  deep_analyst:
    name: "Deep Analyst"
    instruction: "You apply extended reasoning and thorough exploration, especially for complex or technical topics requiring careful step-by-step analysis."

  unconventional_thinker:
    name: "Unconventional Thinker"
    instruction: "You bring fresh perspectives and challenge conventional wisdom, identifying overlooked angles and providing candid, direct assessments."

  devil_advocate:
    name: "Devil's Advocate"
    instruction: "You challenge assumptions and highlight potential flaws, risks, and counterarguments to strengthen the overall analysis."

  pragmatic_implementer:
    name: "Pragmatic Implementer"
    instruction: "You focus on practical execution, feasibility, resource requirements, and real-world constraints that affect implementation."
