# LiteLLM Proxy Configuration
# This replaces OpenRouter with direct provider API calls
#
# Usage:
#   litellm --config litellm_config.yaml --port 4000
#
# Or with pip installed litellm:
#   pip install 'litellm[proxy]'
#   litellm --config litellm_config.yaml --port 4000

model_list:
  # OpenAI Models
  - model_name: openai/gpt-5.5
    litellm_params:
      model: gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
      timeout: 300  # Reasoning model needs extended timeout

  # gpt-5.5-pro is Responses-API-only at OpenAI; our LiteLLM version's
  # chat-completions adapter returns "'NoneType' has no attribute 'get'"
  # parsing its response. Re-add once LiteLLM ships Responses-API routing.

  - model_name: openai/gpt-5.2
    litellm_params:
      model: gpt-5.2
      api_key: os.environ/OPENAI_API_KEY
      timeout: 300  # Reasoning model needs extended timeout

  - model_name: openai/gpt-5.2-instant
    litellm_params:
      model: gpt-5.2-chat-latest
      api_key: os.environ/OPENAI_API_KEY

  # Anthropic Models
  - model_name: anthropic/claude-opus-4.6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 16384

  - model_name: anthropic/claude-sonnet-4.6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  - model_name: anthropic/claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # Google Models
  - model_name: google/gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: google/gemini-3-pro
    litellm_params:
      model: gemini/gemini-3-pro-preview
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: google/gemini-3-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GOOGLE_API_KEY

  # Gemma 4 — open-weights, served via the same Gemini API endpoint.
  # max_tokens lifted: Gemma 4 spends tokens on thinking_blocks before
  # emitting visible content; tiny budgets return empty content.
  - model_name: google/gemma-4-31b
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GOOGLE_API_KEY
      max_tokens: 4096

  - model_name: google/gemma-4-26b-moe
    litellm_params:
      model: gemini/gemma-4-26b-a4b-it
      api_key: os.environ/GOOGLE_API_KEY
      max_tokens: 4096

  # Moonshot/Kimi Models
  # Uses OpenAI-compatible API at api.moonshot.ai
  # K2.5 supports thinking/instant modes via API parameters
  - model_name: moonshot/kimi-k2.5
    litellm_params:
      model: openai/kimi-k2.5
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.ai/v1
      timeout: 300  # Reasoning model needs extended timeout

  # NVIDIA NIM Models
  # Uses OpenAI-compatible API at integrate.api.nvidia.com
  - model_name: nvidia/llama-4-maverick
    litellm_params:
      model: openai/meta/llama-4-maverick-17b-128e-instruct
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1
      max_tokens: 1024

  - model_name: nvidia/deepseek-v3.2
    litellm_params:
      model: openai/deepseek-ai/deepseek-v3.2
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1
      timeout: 300  # Reasoning model needs extended timeout
      max_tokens: 1024

  - model_name: nvidia/qwen-3.5
    litellm_params:
      model: openai/qwen/qwen3-next-80b-a3b-instruct
      api_key: os.environ/NVIDIA_API_KEY
      api_base: https://integrate.api.nvidia.com/v1
      max_tokens: 1024

  # Nemotron family is in NVIDIA NIM's catalog (incl. Nemotron 3 Super 120B-a12b
  # and Nemotron 3 Nano Omni 30B-a3b-reasoning) but the current NVIDIA_API_KEY
  # returns 403 "Authorization failed" for every Nemotron model. Re-enable by
  # adding a route here once entitlement is sorted on the NVIDIA side.
  # Verified-failing examples (all 403 with current key):
  #   nvidia/llama-3.3-nemotron-super-49b-v1.5
  #   nvidia/llama-3.1-nemotron-70b-instruct
  #   nvidia/nemotron-3-super-120b-a12b
  #   nvidia/nemotron-3-nano-omni-30b-a3b-reasoning

litellm_settings:
  # Drop unmapped params to avoid errors with provider-specific params
  drop_params: true
  # Set reasonable timeouts (increased for reasoning models)
  request_timeout: 300

general_settings:
  # Master key for the proxy (optional, can be any string)
  master_key: sk-litellm-master-key
